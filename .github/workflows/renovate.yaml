name: Renovate

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      repositories:
        description: 'Comma separated list of repositories to scan'
        required: false
        type: string

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          owner: ${{ github.repository_owner }}
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_PRIVATE_KEY }}
      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46.1.20
        with:
          configurationFile: default.json
          renovate-version: 43.222.0
          token: ${{ steps.app-token.outputs.token }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.event.inputs.repositories || secrets.RENOVATE_REPOSITORIES }}
          LOG_LEVEL: debug
