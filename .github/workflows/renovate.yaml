name: Renovate

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      repositories:
        description: 'Comma separated list of repositories to scan'
        required: false
        type: string
      log_level:
        description: 'Renovate log level. The run log is deleted when the run ends, so read a debug log while it runs.'
        required: false
        type: choice
        options:
          - warn
          - info
          - debug
        default: warn

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          owner: ${{ github.repository_owner }}
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_PRIVATE_KEY }}
      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46.3.7
        with:
          configurationFile: default.json
          renovate-version: 43.222.0
          token: ${{ steps.app-token.outputs.token }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.event.inputs.repositories || secrets.RENOVATE_REPOSITORIES }}
          # Run logs of a public repository are visible to everyone, and the
          # repositories this job scans are mostly private: keep the scheduled
          # log to warnings.
          LOG_LEVEL: ${{ github.event.inputs.log_level || 'warn' }}
