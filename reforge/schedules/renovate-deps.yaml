# The renovate-deps schedule: tests and merges the Renovate dependency PRs
# that automerge does not take (majors, and minor/patch PRs with red checks),
# grouped across repositories, and pins what cannot be upgraded yet.
name: renovate-deps
cron: 20 */3 * * *
timezone: UTC
template:
  members:
  - key: autopilot
    template:
      repo: spigell/my-renovate
      branch: main
      workspace: isolated
      delivery: none
      steps:
      - id: brief
        role: briefer
        agents:
        - codex
        config:
          codex:
            reasoning_effort: medium
        output:
          params:
            max_tasks: 10
      - id: debrief
        role: briefer
        # The debrief step decides pins in the shared default.json, so it runs
        # on the Claude main login rather than agy.
        agents:
        - claude-main
        output:
          params:
            max_tasks: 2
        wait_for:
          tasks_from:
          - brief
          until: terminal
          timeout_hours: 24
      skill_sets:
      - renovate
      kind: chore
      priority: low
      max_rounds: 3
      goal: Test and merge the Renovate dependency PRs that automerge does not take, and pin what cannot be upgraded yet
      details: |
        Context: the central Renovate job in spigell/my-renovate (cron 0 */3 * * * UTC) opens dependency PRs as spigell-renovate[bot] on renovate/chore/* branches. default.json in this checkout is the shared config: minor and patch updates automerge once checks pass, majors get their own PR (renovate/chore/major-*) and never automerge, and a packageRule with allowedVersions or enabled: false is a pin. An update task works on the Renovate PR branch itself: the worker pushes the coder's commits there and merges the PR once the reviewer approves and every check is green. Once someone else pushes to a Renovate branch, Renovate stops rebasing it. The brief step outputs update tasks; the debrief step reads their results and may output one rule task and one standard ci-fix task (reforge-task-author skill, "Standard ci-fix task"). Neither step changes a repository or a PR.

        Brief:
        1. With github-mcp search_pull_requests, list OPEN PRs in user:spigell authored by spigell-renovate[bot] whose head branch starts with renovate/chore/. Skip renovate/configure, drafts, PRs whose head repository is a fork, and every PR in spigell/my-work-agents and spigell/my-agents: this schedule never takes or merges those repositories' PRs. For each PR read its body and check runs (pull_request_read get and get_check_runs). Then skip every PR that default.json in this checkout already pins: a packageRule that matches its package (matchPackageNames or matchDepNames), whose matchRepositories includes its repository or is absent, and whose allowedVersions excludes the PR's new version (or that sets enabled: false). An update task for it only repeats a known failure. Such a PR can stay open: once a worker has pushed to its branch (the worker merges the base branch into it before the coder runs), Renovate marks it Edited/Blocked and neither rewrites nor closes it. Name these PRs in the summary as pinned and still open, so the operator can reset them with the rebase/retry checkbox (closing one by hand makes Renovate ignore that update). Also skip every PR in a repository that is waiting for a ci-fix, following "Waiting, repeats and the operator" in the reforge-task-author skill: an open PR from reforge/fix/ci-default-branch exists there, or the repository is on the "waiting for ci-fix" list in the previous run's debrief summary and no newer merged fix PR exists. Its update would stop on the same check. Copy that list into your summary as the skill says, updated, so the debrief can carry it on.
        2. Minor or patch PRs: output an update task (key "<repo>#<n>:update") when a check failed or was cancelled. Skip it while checks are pending. Once all passed automerge takes it, so skip it too, unless it is still open more than 24 hours after its last check finished (automerge is off in that repository, or a conflict or a required review stops it): then output its update task as well.
        3. Majors (head branch renovate/chore/major-*): group the PRs by package and target major across repositories, as "<package>@<major>" (for example "eslint@10"; a Renovate group PR is grouped by its group name). Take at most 2 groups per run, the groups with the most repositories first; name the rest in the summary as deferred. For each group:
           - Read the release notes and breaking changes once, from the PR bodies (Renovate puts the release notes there), and write them into every task of the group as <breaking changes>.
           - Pick the pilot: the repository whose PR changes the fewest files, ties by repository name. Output its update task (key "major:<package>@<major>:<repo>").
           - Output the update task of every other repository in the group with after ["major:<package>@<major>:<pilot repo>"], so they run only once the pilot merged, with what the pilot learned. While the pilot PR is still open, output the pilot entry again in every run: the runner skips it as a duplicate and keeps `after` on it.
           - Fit a whole group in this run's 10 tasks, or defer it.
           - Skip a group whose upgrade the previous run's debrief (when the prompt gives it) reported as stopped by an upstream blocker or a needed redesign: its other repositories would hit the same blocker. Name it in the summary as a pin candidate, with that blocker.
        Always output a task when the rules say so: the runner skips a key that already has an active task or one created in the last 2 hours. A key whose last task is no longer active and was created more than 2 hours ago is planned again, so the skips above, not the runner, keep a failed update from repeating.

        update task:
          repo: spigell/<repo>
          branch: <the PR head branch>
          pull_request_number: <n>
          steps:
            - role: renovate-updater
              agents: [codex]
              config: { codex: { reasoning_effort: medium } }
            - role: reviewer
              agents: [claude-main, codex]
          skill_sets: [renovate]
          kind: chore
          workspace: isolated
          delivery: pr
          priority: low
          goal: Make the Renovate PR #<n> in spigell/<repo> (<package> <from> to <to>) pass its build and tests so it can merge
          details: >-
            Context: Renovate PR #<n> updates <package> from <from> to <to> (<major or minor/patch>). <for majors: the breaking changes from the release notes: <breaking changes>. For a non-pilot repository: this upgrade already merged in the pilot spigell/<pilot repo>, see its merged PR for what it needed.> <for a red minor/patch PR: these checks fail: <each failing check name with its job URL>.> <for a green minor/patch PR open over 24 hours: every check passes but it did not automerge<, and why, if the PR shows it>; validate it, and when nothing needs to change give no_changes with that reason, so the reviewer reviews it and the worker merges it.>
            Report: the outcome line your role describes (Updated, Nothing to change, or Stopped), what the upgrade broke and how you fixed it, and every command run with pass/fail.
            Stop if: the upgrade needs a redesign, an upstream fix, or a change outside this repository, or a check fails the same way on the default branch without this update (upstream: pre-existing on <default branch>); end as Stopped, as your role says, so the debrief step can pin the package or brief a fix of the default branch.

        Debrief:
        The prompt gives you every task the brief step created, with its status, PR link and final result. In summary, report for each: merged, or the reason it did not merge (failed, archived with the dependency that stopped it, blocked after max_rounds, or still running); for each major group how many repositories merged; and what the next run will pick up.
        A task that failed because it "made no workspace changes" and whose final summary starts with "Stopped:" stopped on purpose: its failure reason is the one that summary gives, not a worker error. A task blocked after max_rounds whose reviewer findings name an upstream blocker counts the same way. For each such stop, name the <package>@<major> group in the summary with the blocker, so the next run skips the group.
        A stop whose upstream is "pre-existing on <default branch>", or whose evidence shows the failing check fails the same way on the repository's default branch, is not the package's fault: do not pin it and do not name its group as blocked. Handle it with the standard ci-fix task, following "Waiting, repeats and the operator" in the reforge-task-author skill: output it for that repository (key "ci-fix:spigell/<repo>") with the failing commands and error lines from the stop, unless a reforge/fix/ci-default-branch PR is open there, or the brief's "waiting for ci-fix" list shows it already briefed once with no newer merged fix PR, in which case name the repository as needs-operator instead. Carry the brief's "waiting for ci-fix" list into your summary, updated as the skill says, so the next run skips those repositories' PRs. At most one ci-fix task per run: add the other repositories to the list as deferred. A stop marked "unproven" is not evidence: add its repository to the list as needs-operator with that reason, so the brief skips it.
        Then decide whether to pin. Output the rule task only for a package whose update failed for a reason that will not go away soon: a breaking change that needs a redesign, or an upstream bug or blocker with an issue or PR link. A flaky check, a timeout or a reviewer nit is not a reason to pin. At most one rule per run: name the others in the summary as pin candidates. A pin covers only the repositories whose update failed (matchRepositories): default.json is shared by every repository, and a repository where the upgrade already merged must never be held back. Leave matchRepositories out only when the blocker applies to every repository that uses the package (an upstream bug, or a version the operator approved for all), and say why in the summary. Check default.json in this checkout first and skip a package whose existing rule already covers the failed repositories.
        Keep the summary under 3500 characters: one line per task, then short lists. A summary over 4000 characters is rejected.

        rule task:
          repo: spigell/my-renovate
          branch: reforge/chore/renovate-pin-<package slug>
          steps:
            - role: coder
              agents: [codex]
              config: { codex: { reasoning_effort: medium } }
            - role: reviewer
              agents: [claude-main, codex]
          skill_sets: [renovate]
          kind: chore
          workspace: isolated
          delivery: pr
          priority: low
          goal: Pin <package> below <major> for <repositories> until <the reason> is resolved
          details: >-
            Context: the renovate-deps schedule could not upgrade <package> to <to> in <repositories>: <the reason>, see <the failed task's PR link> and <the upstream issue or PR link, if any>. default.json is shared by every repository, so the pin is scoped to the repositories that failed.
            Scope: add one packageRule to default.json after the existing ones: "matchRepositories": ["spigell/<repo>", ...] (the failed repositories; leave it out only when the debrief step said the blocker applies to every repository), "matchPackageNames": ["<package>"] (or matchDepNames when the PR names a dependency, not a package), "allowedVersions": "<<major>", and "description": "<the reason>; source: <the upstream link, else the PR link>; review after: <today plus 30 days, YYYY-MM-DD>". If a rule for <package> with the same allowedVersions already exists, add the repositories to its matchRepositories instead, and rewrite its description so it still gives every reason it covers with its source: "<reason for the existing repositories> / <the reason for the added ones>; source: <existing URL>, <new URL>; review after: <the later of the existing date and today plus 30 days>". Change nothing else.
            Validate in the foreground with `npm exec --yes --package renovate -- renovate-config-validator --strict default.json`.
            Report: the rule added or extended, and the validator output.
            Stop if: default.json already has a rule for <package> that covers these repositories, or one with different allowedVersions; report it.

        Stop if: github-mcp cannot search or read pull requests; output no tasks and report the error.
