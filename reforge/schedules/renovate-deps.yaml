# The renovate-deps schedule: tests and merges the Renovate dependency PRs
# that automerge does not take (majors, and minor/patch PRs with red checks),
# grouped across repositories, and pins what cannot be upgraded yet.
name: renovate-deps
cron: 20 */3 * * *
timezone: UTC
template:
  members:
  - key: autopilot
    template:
      repo: spigell/my-renovate
      branch: main
      workspace: isolated
      delivery: none
      steps:
      - id: brief
        role: briefer
        output:
          params:
            max_tasks: 10
      - id: debrief
        role: briefer
        output:
          params:
            max_tasks: 2
        wait_for:
          tasks_from:
          - brief
          until: terminal
          timeout_hours: 24
      # Grouping majors across repositories and deciding pins is hard
      # judgement, so both steps prefer codex over agy (reforge-task-guider).
      agents:
      - strategy: any
        ids: [claude-secondary]
      - strategy: ordered
        ids: [codex, agy]
      - strategy: any
        ids: [claude-main]
      skill_sets:
      - renovate
      kind: chore
      priority: low
      max_rounds: 3
      goal: Test and merge the Renovate dependency PRs that automerge does not take, and pin what cannot be upgraded yet
      details: |
        Context: the central Renovate job in spigell/my-renovate (cron 0 */3 * * * UTC) opens dependency PRs as spigell-renovate[bot] on renovate/chore/* branches. default.json in this checkout is the shared config; repository-specific pins live in each target repository's renovate.json. Minor and patch updates automerge once checks pass, majors get their own PR (renovate/chore/major-*) and never automerge, and a packageRule with allowedVersions or enabled: false is a pin. An update task works on the Renovate PR branch itself: the worker pushes the coder's commits there and merges the PR once the reviewer approves and every check is green. Once someone else pushes to a Renovate branch, Renovate stops rebasing it. The brief step outputs update tasks; the debrief step reads their results and may output one rule task and one standard ci-fix task (reforge-task-guider skill, "Standard ci-fix task"). Neither step changes a repository or a PR.

        Brief:
        1. With github-mcp search_pull_requests, list OPEN PRs in user:spigell authored by spigell-renovate[bot] whose head branch starts with renovate/chore/. Skip renovate/configure, drafts, PRs whose head repository is a fork, and every PR in spigell/my-work-agents and spigell/my-agents: this schedule never takes or merges those repositories' PRs. For each PR read its body and check runs (pull_request_read get and get_check_runs). Read that repository's renovate.json on its default branch with github-mcp get_file_contents, and default.json in this checkout. Skip a PR when either file has a packageRule that matches its package (matchPackageNames or matchDepNames), whose matchRepositories includes its repository or is absent, and whose allowedVersions excludes the PR's new version (or that sets enabled: false). An update task for it only repeats a known failure. Such a PR can stay open: once a worker has pushed to its branch (the worker merges the base branch into it before the coder runs), Renovate marks it Edited/Blocked and neither rewrites nor closes it. Name these PRs in the summary as pinned and still open, so the operator can reset them with the rebase/retry checkbox (closing one by hand makes Renovate ignore that update). Also skip every PR in a repository that is waiting for a ci-fix, following "Waiting, repeats and the operator" in the reforge-task-guider skill: an open PR from reforge/fix/ci-default-branch exists there, or the repository is on the "waiting for ci-fix" list in the previous run's debrief summary and no newer merged fix PR exists. Its update would stop on the same check. Copy that list into your summary as the skill says, updated, so the debrief can carry it on.
           - Carry a failed-updater ledger from the previous run's debrief summary into this brief summary, then into this run's debrief. Key each entry by <owner/repo>#<PR number>, never just by package or task key. Keep the most recent updater's pre-updater PR head SHA (full SHA), terminal outcome and UTC time observed terminal (failed, blocked, or archived because its dependency failed), role_error_id and role_error_evidence.reason (including the exact "pre-existing on <default branch>:" prefix when present), and any blocking_package/upstream_url. The debrief replaces an entry only with a newer updater result; remove it only when that PR merged or closed. Do not expire it after two hours or seven days. For every NEW update task you output, put its PR identity and current full head SHA from pull_request_read get in the brief summary as "attempt <owner/repo>#<n> before <SHA>" so the debrief can record the SHA from before the worker's base merge or edits. If the prior summary has an outstanding attempt with no terminal result, suppress that PR and defer its dependent major group until the outcome is available; do not guess that intake will dedupe it. Carry its original attempt line unchanged, since the worker may already have changed the head. If a required SHA or outcome is missing, suppress that PR and say which evidence is missing.
           - Before applying minor/patch or major selection, suppress every open PR in that ledger unless one retry condition below is proven. A merged reforge/fix/ci-default-branch PR in the SAME repository, merged after the recorded updater failed, permits one retry only when that updater's role_error_id is needs_operator and role_error_evidence.reason starts exactly "pre-existing on <default branch>:" and contains the proven failing command and error line. Search for the merged fix, confirm its merge time, and recheck the repository's fix status and PR checks; if the fix is open, absent, unrelated to that repository, or its failure remains, keep the PR suppressed. Other errors, including upstream_blocked and a blocked reviewer task, never qualify through a ci-fix merge. Independently, a changed PR head permits one retry only when pull_request_read get_commits, paginated as needed, shows a new commit after the recorded pre-updater SHA authored by spigell-renovate[bot] and that commit is on the current PR head history. A worker-authored edit, base merge, changed SHA alone, or missing commit history is not evidence of a Renovate retry. If the pre-updater SHA is no longer in that history, require other GitHub commit evidence tying the Renovate-authored commit to a later head; otherwise suppress. For either retry, reapply the pin check above and the existing ci-fix waiting-list check before outputting a task; an applicable pin or still-unfixed repository keeps it skipped. Name each suppressed PR and the reason in the summary. A newly output retry gets a new "attempt" line; its result becomes the newest ledger entry and consumes that retry condition. Preserve ledger and attempt lines ahead of optional narrative within the 3500-character summary limit; if they cannot fit, output no new tasks and report the missing carry capacity instead of losing suppression state.
        2. Minor or patch PRs: output an update task (key "<repo>#<n>:update") when a check failed or was cancelled. Skip it while checks are pending. Once all passed automerge takes it, so skip it too, unless it is still open more than 24 hours after its last check finished (automerge is off in that repository, or a conflict or a required review stops it): then output its update task as well.
        3. Majors (head branch renovate/chore/major-*): group the PRs by package and target major across repositories, as "<package>@<major>" (for example "eslint@10"; a Renovate group PR is grouped by its group name). Take at most 2 groups per run, the groups with the most repositories first; name the rest in the summary as deferred. For each group:
           - Read the release notes and breaking changes once, from the PR bodies (Renovate puts the release notes there), and write them into every task of the group as <breaking changes>.
           - Pick the pilot: the repository whose PR changes the fewest files, ties by repository name. Output its update task (key "major:<package>@<major>:<repo>").
           - Output the update task of every other repository in the group with after ["major:<package>@<major>:<pilot repo>"], so they run only once the pilot merged, with what the pilot learned. While the pilot PR is still open, output the pilot entry again in every run if no failed-updater ledger entry or outstanding attempt suppresses it: the runner skips an active or recent task as a duplicate and keeps `after` on it.
           - Fit a whole group in this run's 10 tasks, or defer it.
           - Skip a group whose upgrade the previous run's debrief (when the prompt gives it) reported as blocked by upstream_blocked: its other repositories would hit the same blocker. Carry its deferred repository/package pin candidates, failed PR links and blocker evidence into the summary for this run's debrief. A needs_operator report about a redesign is an operator question, not a reason to skip the group or call it a pin candidate.
        Always output a task when the rules say so after the failed-updater gate: the runner skips a key that already has an active task or one created in the last 2 hours. A key whose last task is no longer active and was created more than 2 hours ago is planned again, so the ledger, not runner dedupe, keeps a failed update from repeating.

        update task:
          repo: spigell/<repo>
          branch: <the PR head branch>
          pull_request_number: <n>
          steps:
            - role: renovate-updater
              agents: [{strategy: any, ids: [claude-secondary]}, {strategy: ordered, ids: [codex, agy]}, {strategy: any, ids: [claude-main]}]
            - role: reviewer
              agents: [{strategy: any, ids: [claude-secondary]}, {strategy: ordered, ids: [codex, claude-main]}]
          skill_sets: [renovate]
          kind: chore
          workspace: isolated
          delivery: pr
          priority: low
          goal: Make the Renovate PR #<n> in spigell/<repo> (<package> <from> to <to>) pass its build and tests so it can merge
          details: >-
            Context: Renovate PR #<n> updates <package> from <from> to <to> (<major or minor/patch>). <for majors: the breaking changes from the release notes: <breaking changes>. For a non-pilot repository: this upgrade already merged in the pilot spigell/<pilot repo>, see its merged PR for what it needed.> <for a red minor/patch PR: these checks fail: <each failing check name with its job URL>.> <for a green minor/patch PR open over 24 hours: every check passes but it did not automerge<, and why, if the PR shows it>; validate it, and when nothing needs to change give no_changes with that reason, so the reviewer reviews it and the worker merges it.>
            Report: the outcome or error line your role describes, what the upgrade broke and how you fixed it, and every command run with pass/fail.
            If an upstream dependency cannot support the requested version, return upstream_blocked with reason, blocking_package and upstream_url when available. Use needs_operator with a question for a policy decision or redesign; for a proven pre-existing default-branch failure, include "pre-existing on <default branch>:" and the failing command and error line in its reason so the debrief can brief a ci-fix. Use external_unavailable with reason and service when a needed service is down. Follow the role instructions for evidence and a clean checkout; never return an empty result for a stop.
            Before reporting or stopping on a pre-existing default-branch failure, check the PR and default-branch CI check runs and workflow runs with github-mcp. If a step fails locally only because the worker lacks a system library or tool while CI passes it, rely on CI, report the worker environment limit, and do not stop or call it a repository defect; use external_unavailable only when no CI result exists for a required step.

        Debrief:
        The prompt gives you every task the brief step created, with its status, PR link and final result. In summary, report for each: merged, or the reason it did not merge (failed, archived with the dependency that stopped it, blocked after max_rounds, or still running); for each major group how many repositories merged; and what the next run will pick up.
        Carry the brief's failed-updater ledger and "attempt <owner/repo>#<n> before <SHA>" lines. For each attempted updater that failed, was blocked (including at reviewer after max_rounds), or was archived because its dependency failed, replace that PR's ledger entry with this latest outcome, the UTC time you observed it terminal, and the pre-updater SHA from its attempt line; include role_error_id and role_error_evidence.reason exactly when supplied, plus blocking_package/upstream_url when present. A failed task without a declared role error still gets a failed entry with its failure reason. A reviewer block still gets a blocked entry with its finding. Do not infer a pre-existing failure from free-text findings or a ci-fix elsewhere. Remove an entry only after confirming its PR merged or closed; carry other entries, including upstream_blocked and errors without evidence, unchanged. Once a result is recorded in the ledger, remove its attempt line. For a still-running task, carry its attempt line so its eventual outcome can be linked to the pre-updater SHA; do not mark it as failed. If the task result, attempt SHA, or ledger cannot be read or retained within the summary limit, output no follow-up tasks and report which evidence is unavailable instead of silently dropping an entry.
        A child with failure_reason role_error and role_error_id upstream_blocked (shown as role_error:upstream_blocked) has an upstream dependency blocker. Read role_error_evidence.reason, blocking_package and upstream_url; use blocking_package to identify the dependency that blocks the requested package and upstream_url as the source when present. Name its <package>@<major> group with that blocker in the summary so the next run skips the group. A task blocked after max_rounds whose reviewer findings name an upstream blocker counts as a pin candidate too. A child with role_error:external_unavailable is waiting on the named service; report it without pinning. Treat role_error:needs_operator as a question for the operator, except for the proven default-branch failure case below; report its reason and question without pinning.
        A needs_operator error whose reason starts "pre-existing on <default branch>:" and whose evidence or summary gives the failing command and error line is not the package's fault: do not pin it and do not name its group as blocked. Handle it with the standard ci-fix task, following "Waiting, repeats and the operator" in the reforge-task-guider skill: output it for that repository (key "ci-fix:spigell/<repo>") with the failing commands and error lines from the error, unless a reforge/fix/ci-default-branch PR is open there, or the brief's "waiting for ci-fix" list shows it already briefed once with no newer merged fix PR, in which case name the repository as needs-operator instead. Carry the brief's "waiting for ci-fix" list into your summary, updated as the skill says, so the next run skips those repositories' PRs. At most one ci-fix task per run: add the other repositories to the list as deferred. A failure marked "unproven" is not evidence: add its repository to the list as needs-operator with that reason, so the brief skips it.
        Before creating a ci-fix task for a claimed pre-existing failure, check the PR and default-branch CI check runs and workflow runs with github-mcp. If the step passes in CI and fails locally only because the worker lacks a system library or tool, report the worker environment limit and do not create a ci-fix task or call it a repository defect; use external_unavailable only when no CI result exists for a required step.
        Then decide whether to pin. Output the rule task only for a package whose update failed for a reason that will not go away soon: an upstream bug or blocker with an issue or PR link, or a breaking change that needs a redesign only after the operator explicitly approves pinning it. A needs_operator error alone never authorizes a pin. For upstream_blocked, use role_error_evidence.blocking_package to explain what blocks the requested package and role_error_evidence.upstream_url for the pin source when present; otherwise use the failed task's PR link. A flaky check, a timeout or a reviewer nit is not a reason to pin. Consider both this run's failures and deferred candidates carried in the brief summary from the previous run; confirm the blocker still holds before acting on a deferred candidate. Create a separate rule task for each failed repository, even when several fail on the same package. At most one rule task per run: name every other repository/package pair in the summary as a pin candidate for a later run, with its failed PR link and blocker evidence so the next run can act on it. Check default.json in this checkout and each failed repository's renovate.json on its default branch with github-mcp get_file_contents; skip a candidate already covered by a matching pin in either file that applies to the failed repository (matchRepositories absent or includes spigell/<repo>), or whose upgrade has since merged. Put new pins in the failed repository's renovate.json without matchRepositories, so repositories where the upgrade merged stay unaffected. Only create an account-wide rule in default.json when the operator explicitly approved account-wide pinning; state that approval in the task and summary, target spigell/my-renovate, edit default.json, and validate default.json with the strict Renovate validator.
        Keep the summary under 3500 characters: one line per task, then short lists. A summary over 4000 characters is rejected.

        rule task (key "pin:<repo>:<package slug>"):
          repo: spigell/<repo>
          branch: reforge/chore/renovate-pin-<package slug>
          steps:
            - role: coder
              agents: [{strategy: any, ids: [claude-secondary]}, {strategy: ordered, ids: [codex, agy]}, {strategy: any, ids: [claude-main]}]
            - role: reviewer
              agents: [{strategy: any, ids: [claude-secondary]}, {strategy: ordered, ids: [codex, claude-main]}]
          skill_sets: [renovate]
          kind: chore
          workspace: isolated
          delivery: pr
          priority: low
          goal: Pin <package> below <major> in spigell/<repo> until <the reason> is resolved
          details: >-
            Context: the renovate-deps schedule could not upgrade <package> to <to> in spigell/<repo>: <the reason>, see <the failed task's PR link> and <the upstream issue or PR link, if any>. This pin belongs only in that repository.
            Scope: add one packageRule to this repository's renovate.json (create packageRules if missing; keep its existing extends of the central config): "matchPackageNames": ["<package>"] (or matchDepNames when the PR names a dependency, not a package), "allowedVersions": "<<major>", and "description": "<the reason>; source: <the upstream link, else the PR link>; review after: <today plus 30 days, YYYY-MM-DD>". Do not add matchRepositories. Change nothing else.
            Validate in the foreground with `npm exec --yes --package renovate -- renovate-config-validator --strict renovate.json`.
            Report: the rule added and the validator output.
            Stop if: this repository's renovate.json or the shared default.json in spigell/my-renovate has a rule matching <package> (via matchPackageNames or matchDepNames) that applies to spigell/<repo> (matchRepositories absent or includes spigell/<repo>) and either already excludes <to> or conflicts with the proposed pin; report the applicable rule.

        Stop if: github-mcp cannot search or read pull requests or the required renovate.json files; output no tasks and report the error.
